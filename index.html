<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
        }
        
        select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s;
            background-color: white;
        }
        
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        select.error {
            border-color: #f56565;
        }
        
        .btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .error-message {
            color: #f56565;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }
        
        .loader {
            display: none;
            text-align: center;
            margin-top: 1rem;
        }
        
        .loader:after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .note {
            text-align: center;
            margin-top: 1rem;
            color: #666;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        
        <div class="form-group">
            <label for="name">Select Name</label>
            <select id="name" class="name-select">
                <option value="">Loading names...</option>
            </select>
            <div class="error-message" id="nameError">Please select a name</div>
        </div>
        
        <div class="form-group">
            <label for="houseNo">Select House Number</label>
            <select id="houseNo" class="house-select" disabled>
                <option value="">Select name first</option>
            </select>
            <div class="error-message" id="houseError">Please select a house number</div>
        </div>
        
        <button class="btn" onclick="login()">Login</button>
        
        <div class="loader" id="loader"></div>
        <div class="note">Select your name and house number to continue</div>
    </div>

    <script>
        let credentials = [];
        let nameToHouseMap = {};
        
        // Load credentials when page loads
        window.onload = function() {
            loadCredentials();
        };
        
        function loadCredentials() {
            const nameSelect = document.getElementById('name');
            const loader = document.getElementById('loader');
            
            loader.style.display = 'block';
            nameSelect.innerHTML = '<option value="">Loading...</option>';
            
            // Fetch from CSV
            fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vRTwV2yxjrQAm1q4HGXhfpLlvmbc7igJbAZEuoqA2NRtGCEkBQGb2t5sHjPUik2MQiTCMhpEAxmwKsZ/pub?gid=0&single=true&output=csv')
                .then(response => response.text())
                .then(csvData => {
                    const lines = csvData.split('\n');
                    const headers = lines[0].split(',');
                    
                    credentials = [];
                    nameToHouseMap = {};
                    
                    for (let i = 1; i < lines.length; i++) {
                        if (lines[i].trim()) {
                            const values = lines[i].split(',');
                            const name = values[headers.indexOf('name')]?.replace(/"/g, '').trim();
                            const houseNo = values[headers.indexOf('house_no')]?.replace(/"/g, '').trim();
                            const image = values[headers.indexOf('image')]?.replace(/"/g, '').trim();
                            
                            if (name && houseNo) {
                                credentials.push({ name, house_no: houseNo, image });
                                if (!nameToHouseMap[name]) {
                                    nameToHouseMap[name] = [];
                                }
                                nameToHouseMap[name].push(houseNo);
                            }
                        }
                    }
                    
                    // Populate name dropdown
                    const uniqueNames = [...new Set(credentials.map(c => c.name))];
                    nameSelect.innerHTML = '<option value="">Select Name</option>';
                    uniqueNames.forEach(name => {
                        nameSelect.innerHTML += `<option value="${name}">${name}</option>`;
                    });
                    
                    loader.style.display = 'none';
                })
                .catch(error => {
                    console.error('Error loading CSV:', error);
                    nameSelect.innerHTML = '<option value="">Error loading data</option>';
                    loader.style.display = 'none';
                });
        }
        
        // Update house numbers when name is selected
        document.getElementById('name').addEventListener('change', function() {
            const selectedName = this.value;
            const houseSelect = document.getElementById('houseNo');
            const houseError = document.getElementById('houseError');
            
            if (selectedName) {
                const houses = nameToHouseMap[selectedName] || [];
                houseSelect.innerHTML = '<option value="">Select House Number</option>';
                houses.forEach(house => {
                    houseSelect.innerHTML += `<option value="${house}">${house}</option>`;
                });
                houseSelect.disabled = false;
                houseError.style.display = 'none';
            } else {
                houseSelect.innerHTML = '<option value="">Select name first</option>';
                houseSelect.disabled = true;
            }
            
            // Remove error styling
            document.getElementById('name').classList.remove('error');
        });
        
        function login() {
            const name = document.getElementById('name').value;
            const houseNo = document.getElementById('houseNo').value;
            const nameSelect = document.getElementById('name');
            const houseSelect = document.getElementById('houseNo');
            const nameError = document.getElementById('nameError');
            const houseError = document.getElementById('houseError');
            
            let isValid = true;
            
            if (!name) {
                nameSelect.classList.add('error');
                nameError.style.display = 'block';
                isValid = false;
            } else {
                nameSelect.classList.remove('error');
                nameError.style.display = 'none';
            }
            
            if (!houseNo) {
                houseSelect.classList.add('error');
                houseError.style.display = 'block';
                isValid = false;
            } else {
                houseSelect.classList.remove('error');
                houseError.style.display = 'none';
            }
            
            if (isValid) {
                const user = credentials.find(c => c.name === name && c.house_no === houseNo);
                if (user) {
                    sessionStorage.setItem('userName', name);
                    sessionStorage.setItem('userHouse', houseNo);
                    sessionStorage.setItem('userImage', user.image || '');
                    window.location.href = 'dashboard.html';
                } else {
                    alert('Invalid credentials. Please check your name and house number.');
                }
            }
        }
    </script>
</body>
</html>
