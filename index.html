<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Login System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            transition: all 0.3s ease;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }
        }
        
        h1 {
            color: #333;
            margin-bottom: 2rem;
            text-align: center;
            font-size: clamp(1.8rem, 5vw, 2.2rem);
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        select, input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
            background-color: white;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }
        
        input {
            background-image: none;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        select.error, input.error {
            border-color: #f56565;
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .btn:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.5);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .error-message {
            color: #f56565;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
            padding-left: 0.5rem;
            font-weight: 500;
        }
        
        .loader-container {
            display: none;
            text-align: center;
            margin-top: 1.5rem;
        }
        
        .loader {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .note {
            text-align: center;
            margin-top: 1.5rem;
            color: #888;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        
        .alert {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: none;
            font-size: 0.95rem;
            text-align: center;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .alert-error {
            background: #fff5f5;
            color: #c53030;
            border: 1px solid #feb2b2;
        }
        
        .alert-success {
            background: #f0fff4;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }
        
        select:disabled {
            background-color: #f7fafc;
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        .loading-text {
            color: #667eea;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
        
        @media (max-width: 768px) {
            .container {
                max-width: 100%;
            }
            
            select, input, .btn {
                padding: 0.875rem;
            }
        }
        
        @media (max-width: 380px) {
            .container {
                padding: 1rem;
            }
            
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Login</h1>
        
        <div id="loginAlert" class="alert alert-error"></div>
        
        <div class="form-group">
            <label>👤 Select Name</label>
            <select id="name" class="name-select">
                <option value="">Loading names...</option>
            </select>
            <div class="error-message" id="nameError">Please select a name</div>
        </div>
        
        <div class="form-group">
            <label>🏠 Select House Number</label>
            <select id="houseNo" class="house-select" disabled>
                <option value="">Select name first</option>
            </select>
            <div class="error-message" id="houseError">Please select a house number</div>
        </div>
        
        <button class="btn" onclick="login()">Login to Dashboard</button>
        
        <div class="loader-container" id="loaderContainer">
            <div class="loader"></div>
            <div class="loading-text">Loading data...</div>
        </div>
        
        <div class="note">
            ✨ Select your name and house number to continue<br>
            <small>Your data is secure and encrypted</small>
        </div>
    </div>

    <script>
        let credentials = [];
        let nameToHouseMap = {};
        
        window.onload = function() {
            loadCredentials();
        };
        
        function loadCredentials() {
            const nameSelect = document.getElementById('name');
            const loaderContainer = document.getElementById('loaderContainer');
            const alert = document.getElementById('loginAlert');
            
            loaderContainer.style.display = 'block';
            nameSelect.innerHTML = '<option value="">⏳ Loading...</option>';
            alert.style.display = 'none';
            
            fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vRTwV2yxjrQAm1q4HGXhfpLlvmbc7igJbAZEuoqA2NRtGCEkBQGb2t5sHjPUik2MQiTCMhpEAxmwKsZ/pub?gid=0&single=true&output=csv')
                .then(response => response.text())
                .then(csvData => {
                    const lines = csvData.split('\n');
                    const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
                    
                    credentials = [];
                    nameToHouseMap = {};
                    
                    for (let i = 1; i < lines.length; i++) {
                        if (lines[i].trim()) {
                            const values = lines[i].match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g);
                            if (values) {
                                const name = values[headers.indexOf('name')]?.replace(/"/g, '').trim();
                                const houseNo = values[headers.indexOf('house_no')]?.replace(/"/g, '').trim();
                                const pdfUrl = values[headers.indexOf('pdf_url')]?.replace(/"/g, '').trim();
                                
                                if (name && houseNo) {
                                    credentials.push({ name, house_no: houseNo, pdf_url: pdfUrl });
                                    if (!nameToHouseMap[name]) {
                                        nameToHouseMap[name] = [];
                                    }
                                    nameToHouseMap[name].push(houseNo);
                                }
                            }
                        }
                    }
                    
                    const uniqueNames = [...new Set(credentials.map(c => c.name))];
                    if (uniqueNames.length > 0) {
                        nameSelect.innerHTML = '<option value="">📋 Select Name</option>';
                        uniqueNames.forEach(name => {
                            nameSelect.innerHTML += `<option value="${name}">${name}</option>`;
                        });
                    } else {
                        nameSelect.innerHTML = '<option value="">❌ No data available</option>';
                    }
                    
                    loaderContainer.style.display = 'none';
                })
                .catch(error => {
                    console.error('Error loading CSV:', error);
                    nameSelect.innerHTML = '<option value="">❌ Error loading data</option>';
                    alert.textContent = 'Failed to load user data. Please refresh the page.';
                    alert.style.display = 'block';
                    loaderContainer.style.display = 'none';
                });
        }
        
        document.getElementById('name').addEventListener('change', function() {
            const selectedName = this.value;
            const houseSelect = document.getElementById('houseNo');
            const houseError = document.getElementById('houseError');
            
            if (selectedName) {
                const houses = nameToHouseMap[selectedName] || [];
                houseSelect.innerHTML = '<option value="">🏠 Select House Number</option>';
                houses.forEach(house => {
                    houseSelect.innerHTML += `<option value="${house}">House ${house}</option>`;
                });
                houseSelect.disabled = false;
                houseError.style.display = 'none';
                
                // Add success animation
                houseSelect.style.transform = 'scale(1.02)';
                setTimeout(() => {
                    houseSelect.style.transform = 'scale(1)';
                }, 200);
            } else {
                houseSelect.innerHTML = '<option value="">⚠️ Select name first</option>';
                houseSelect.disabled = true;
            }
            
            document.getElementById('name').classList.remove('error');
        });
        
        function login() {
            const name = document.getElementById('name').value;
            const houseNo = document.getElementById('houseNo').value;
            const nameSelect = document.getElementById('name');
            const houseSelect = document.getElementById('houseNo');
            const nameError = document.getElementById('nameError');
            const houseError = document.getElementById('houseError');
            
            let isValid = true;
            
            if (!name) {
                nameSelect.classList.add('error');
                nameError.style.display = 'block';
                isValid = false;
            } else {
                nameSelect.classList.remove('error');
                nameError.style.display = 'none';
            }
            
            if (!houseNo) {
                houseSelect.classList.add('error');
                houseError.style.display = 'block';
                isValid = false;
            } else {
                houseSelect.classList.remove('error');
                houseError.style.display = 'none';
            }
            
            if (isValid) {
                const user = credentials.find(c => c.name === name && c.house_no === houseNo);
                if (user) {
                    // Add loading animation
                    const btn = document.querySelector('.btn');
                    btn.innerHTML = '⏳ Logging in...';
                    btn.disabled = true;
                    
                    sessionStorage.setItem('userName', name);
                    sessionStorage.setItem('userHouse', houseNo);
                    sessionStorage.setItem('userPdfUrl', user.pdf_url || '');
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    document.getElementById('loginAlert').textContent = '❌ Invalid credentials. Please check your name and house number.';
                    document.getElementById('loginAlert').style.display = 'block';
                    
                    // Shake animation on error
                    document.querySelector('.container').style.animation = 'shake 0.5s ease-in-out';
                    setTimeout(() => {
                        document.querySelector('.container').style.animation = '';
                    }, 500);
                }
            }
        }
        
        // Add input animation
        document.querySelectorAll('select').forEach(select => {
            select.addEventListener('focus', function() {
                this.parentElement.style.transform = 'translateY(-2px)';
            });
            
            select.addEventListener('blur', function() {
                this.parentElement.style.transform = 'translateY(0)';
            });
        });
    </script>
</body>
</html>
