<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #f0f2f5;
            min-height: 100vh;
        }
        
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        @media (max-width: 768px) {
            .navbar {
                padding: 1rem;
                flex-direction: column;
                gap: 0.5rem;
                text-align: center;
            }
        }
        
        @media (max-width: 480px) {
            .navbar {
                padding: 0.75rem;
            }
        }
        
        .user-info {
            font-size: clamp(1rem, 4vw, 1.2rem);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .user-info::before {
            content: '👤';
            font-size: 1.3rem;
        }
        
        .logout-btn {
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            backdrop-filter: blur(5px);
        }
        
        @media (max-width: 768px) {
            .logout-btn {
                width: 100%;
                max-width: 200px;
            }
        }
        
        .logout-btn:hover {
            background: rgba(255,255,255,0.25);
            border-color: rgba(255,255,255,0.5);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 0 1rem;
                margin: 1rem auto;
            }
        }
        
        .welcome-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            animation: slideDown 0.5s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .welcome-card h2 {
            color: #333;
            font-size: clamp(1.3rem, 5vw, 1.8rem);
            margin-bottom: 0.5rem;
        }
        
        .welcome-card p {
            color: #666;
            font-size: 1rem;
        }
        
        .buttons-section {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        
        @media (max-width: 640px) {
            .buttons-section {
                gap: 1rem;
            }
        }
        
        .action-btn {
            padding: 1.2rem 2.5rem;
            border: none;
            border-radius: 50px;
            font-size: clamp(1rem, 4vw, 1.2rem);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 200px;
            max-width: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }
        
        @media (max-width: 480px) {
            .action-btn {
                min-width: 100%;
                padding: 1rem;
            }
        }
        
        .action-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .action-btn:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .old-details {
            background: linear-gradient(135deg, #667eea 0%, #5a67d8 100%);
            color: white;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .new-details {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            box-shadow: 0 10px 20px rgba(72, 187, 120, 0.3);
        }
        
        .action-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        
        .action-btn:active {
            transform: translateY(0);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease;
            overflow-y: auto;
            padding: 1rem;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-content {
            position: relative;
            background: white;
            margin: 2rem auto;
            padding: 2rem;
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            animation: slideUp 0.4s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 768px) {
            .modal-content {
                margin: 1rem auto;
                padding: 1.5rem;
                width: 95%;
            }
        }
        
        @media (max-width: 480px) {
            .modal-content {
                padding: 1.25rem;
            }
        }
        
        .close-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            font-size: 1.8rem;
            cursor: pointer;
            color: #999;
            transition: all 0.3s;
            background: none;
            border: none;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #f0f0f0;
        }
        
        @media (max-width: 480px) {
            .close-btn {
                top: 1rem;
                right: 1rem;
                width: 35px;
                height: 35px;
                font-size: 1.5rem;
            }
        }
        
        .close-btn:hover {
            color: #f56565;
            transform: rotate(90deg);
            background: #fee;
        }
        
        h2 {
            color: #333;
            margin-bottom: 2rem;
            font-size: clamp(1.3rem, 5vw, 1.8rem);
            padding-right: 2rem;
        }
        
        h3 {
            color: #4a5568;
            margin: 1.5rem 0 1rem 0;
            font-size: 1.3rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.5rem;
        }
        
        h4 {
            color: #2d3748;
            margin: 1.5rem 0 1rem 0;
            font-size: 1.1rem;
            background: #edf2f7;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }
        
        .pdf-container {
            text-align: center;
            margin: 1.5rem 0;
            padding: 1rem;
            background: #f9f9f9;
            border-radius: 20px;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .pdf-container iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        
        @media (max-width: 768px) {
            .pdf-container iframe {
                height: 500px;
            }
        }
        
        @media (max-width: 480px) {
            .pdf-container iframe {
                height: 400px;
            }
        }
        
        #noPdfMsg {
            color: #888;
            font-size: 1.1rem;
            padding: 3rem;
            background: white;
            border-radius: 15px;
            border: 2px dashed #ddd;
            text-align: center;
        }
        
        #noPdfMsg span {
            font-size: 3rem;
            display: block;
            margin-bottom: 1rem;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #4a5568;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: all 0.3s;
            background-color: white;
        }
        
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-group input[readonly] {
            background-color: #f7fafc;
            cursor: not-allowed;
            border-color: #ddd;
            color: #666;
        }
        
        .member-section {
            background: #f8fafc;
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 2px solid #edf2f7;
            position: relative;
        }
        
        .member-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .member-header h5 {
            color: #2d3748;
            font-size: 1.1rem;
            font-weight: 600;
        }
        
        .remove-member {
            background: #f56565;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .remove-member:hover {
            background: #c53030;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(197, 48, 48, 0.3);
        }
        
        .add-member {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 1rem 1.5rem;
            cursor: pointer;
            margin: 1rem 0;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
        }
        
        .add-member:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .submit-btn {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 2rem;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(72, 187, 120, 0.4);
        }
        
        .submit-btn:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .alert {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: none;
            font-weight: 500;
            text-align: center;
            animation: slideIn 0.3s ease;
        }
        
        .alert-success {
            background: #f0fff4;
            color: #22543d;
            border: 2px solid #9ae6b4;
        }
        
        .alert-error {
            background: #fff5f5;
            color: #742a2a;
            border: 2px solid #fc8181;
        }
        
        .loader {
            display: none;
            text-align: center;
            margin: 2rem 0;
        }
        
        .loader:after {
            content: '';
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .info-card {
            background: #f7fafc;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        
        .info-card strong {
            color: #4a5568;
            display: block;
            margin-bottom: 0.25rem;
            font-size: 0.9rem;
        }
        
        .info-card p {
            color: #2d3748;
            font-size: 1.1rem;
            font-weight: 600;
        }
        
        .radio-group {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: normal;
            color: #4a5568;
            cursor: pointer;
        }
        
        .radio-group input[type="radio"] {
            width: auto;
            margin-right: 0.25rem;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        @keyframes slideOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(100%);
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="user-info" id="userInfo"></div>
        <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </div>
    
    <div class="container">
        <div class="welcome-card">
            <h2>Welcome to Dashboard</h2>
            <p>Choose an option below to view or update your details</p>
        </div>
        
        <div class="buttons-section">
            <button class="action-btn old-details" onclick="showOldDetails()">
                <span>📄</span> Old Details (PDF)
            </button>
            <button class="action-btn new-details" onclick="showNewDetails()">
                <span>📝</span> New Details Form
            </button>
        </div>
    </div>
    
    <!-- Old Details Modal - PDF Viewer -->
    <div id="oldDetailsModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('oldDetailsModal')">&times;</button>
            <h2>📄 Document Viewer</h2>
            <div class="pdf-container" id="pdfContainer">
                <iframe id="pdfViewer" src="" frameborder="0" style="display: none;"></iframe>
                <div id="noPdfMsg" style="display: none;">
                    <span>📄</span>
                    <p>No PDF document available</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- New Details Modal - Comprehensive Form -->
    <div id="newDetailsModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('newDetailsModal')">&times;</button>
            <h2>📝 Complete Details Form</h2>
            
            <div id="formAlert" class="alert"></div>
            <div id="formLoader" class="loader"></div>
            
            <form id="newDetailsForm">
                <!-- User Info Cards -->
                <div class="form-grid">
                    <div class="info-card">
                        <strong>Name</strong>
                        <p id="displayName"></p>
                    </div>
                    <div class="info-card">
                        <strong>House No</strong>
                        <p id="displayHouseNo"></p>
                    </div>
                </div>

                <!-- Main Form Fields -->
                <h3>🏠 Basic Information</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="block">Block *</label>
                        <input type="text" id="block" required placeholder="Enter block (e.g., A)">
                    </div>
                    
                    <div class="form-group">
                        <label for="grade">Grade *</label>
                        <input type="text" id="grade" required placeholder="Enter grade">
                    </div>
                    
                    <div class="form-group">
                        <label for="mobile">Mobile Number *</label>
                        <input type="tel" id="mobile" required placeholder="10-digit mobile" pattern="[0-9]{10}" maxlength="10">
                    </div>
                    
                    <div class="form-group">
                        <label for="houseHolder">House Holder Name *</label>
                        <input type="text" id="houseHolder" required placeholder="Enter house holder name">
                    </div>
                    
                    <div class="form-group">
                        <label for="houseName">House Name *</label>
                        <input type="text" id="houseName" required placeholder="Enter house name">
                    </div>
                    
                    <div class="form-group">
                        <label for="fatherName">Father's Name *</label>
                        <input type="text" id="fatherName" required placeholder="Enter father's name">
                    </div>
                    
                    <div class="form-group">
                        <label for="place">Place *</label>
                        <input type="text" id="place" required placeholder="Enter place">
                    </div>
                    
                    <div class="form-group">
                        <label for="houseType">House Type *</label>
                        <select id="houseType" required>
                            <option value="">Select house type</option>
                            <option value="Own">Own</option>
                            <option value="Rented">Rented</option>
                            <option value="Leased">Leased</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="gender">Gender *</label>
                        <select id="gender" required>
                            <option value="">Select gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="postalAddress">Postal Address *</label>
                        <textarea id="postalAddress" required placeholder="Enter complete postal address" rows="2"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="rationCard">Ration Card No *</label>
                        <input type="text" id="rationCard" required placeholder="Enter ration card number">
                    </div>
                    
                    <div class="form-group">
                        <label for="division">Division *</label>
                        <input type="text" id="division" required placeholder="Enter division">
                    </div>
                    
                    <div class="form-group">
                        <label for="ward">Ward *</label>
                        <input type="text" id="ward" required placeholder="Enter ward">
                    </div>
                    
                    <div class="form-group">
                        <label for="buildingNo">Building No *</label>
                        <input type="text" id="buildingNo" required placeholder="Enter building number">
                    </div>
                    
                    <div class="form-group">
                        <label for="oldHouseNo">Old House No *</label>
                        <input type="text" id="oldHouseNo" required placeholder="Enter old house number">
                    </div>
                    
                    <div class="form-group">
                        <label for="madrasa">Madrasa *</label>
                        <input type="text" id="madrasa" required placeholder="Enter madrasa name">
                    </div>
                    
                    <div class="form-group">
                        <label for="anyGrant">Any Grant? *</label>
                        <select id="anyGrant" required>
                            <option value="">Select</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="donation">Donation *</label>
                        <input type="text" id="donation" required placeholder="Enter donation amount/details">
                    </div>
                </div>

                <!-- Family Members Section -->
                <h3>👥 Family Members</h3>
                <div id="membersContainer"></div>
                <button type="button" class="add-member" onclick="addMember()">➕ Add Family Member</button>
                
                <button type="submit" class="submit-btn">✅ Submit to Google Sheet</button>
            </form>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwYAUGReghNUxw9ilwe1wdlwFAz8PpjXR4zOaial6Q1LeiA4jmdHMcVXnp5XnVYl5UARA/exec';
        let memberCount = 0;
        
        window.onload = function() {
            const userName = sessionStorage.getItem('userName');
            const userHouse = sessionStorage.getItem('userHouse');
            
            if (!userName || !userHouse) {
                window.location.href = 'index.html';
                return;
            }
            
            document.getElementById('userInfo').innerHTML = `${userName} | 🏠 House ${userHouse}`;
            document.getElementById('displayName').textContent = userName;
            document.getElementById('displayHouseNo').textContent = userHouse;
        };
        
        function logout() {
            const btn = document.querySelector('.logout-btn');
            btn.innerHTML = '⏳ Logging out...';
            btn.disabled = true;
            
            setTimeout(() => {
                sessionStorage.clear();
                window.location.href = 'index.html';
            }, 500);
        }
        
        function showOldDetails() {
            const pdfUrl = sessionStorage.getItem('userPdfUrl');
            const pdfViewer = document.getElementById('pdfViewer');
            const noPdfMsg = document.getElementById('noPdfMsg');
            
            if (pdfUrl && pdfUrl.trim() !== '') {
                // Convert to preview URL if it's a Google Drive link
                let previewUrl = pdfUrl;
                if (pdfUrl.includes('drive.google.com/file/d/')) {
                    const fileId = pdfUrl.match(/\/d\/(.+?)(\/|$)/);
                    if (fileId && fileId[1]) {
                        previewUrl = `https://drive.google.com/file/d/${fileId[1]}/preview`;
                    }
                }
                
                pdfViewer.src = previewUrl;
                pdfViewer.style.display = 'block';
                noPdfMsg.style.display = 'none';
            } else {
                pdfViewer.style.display = 'none';
                noPdfMsg.style.display = 'block';
            }
            
            document.getElementById('oldDetailsModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }
        
        function showNewDetails() {
            memberCount = 0;
            document.getElementById('membersContainer').innerHTML = '';
            document.getElementById('newDetailsModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
            document.body.style.overflow = 'auto';
            document.getElementById('formAlert').style.display = 'none';
        }
        
        function addMember() {
            memberCount++;
            const container = document.getElementById('membersContainer');
            
            const memberDiv = document.createElement('div');
            memberDiv.className = 'member-section';
            memberDiv.id = `member_${memberCount}`;
            
            memberDiv.innerHTML = `
                <div class="member-header">
                    <h5>👤 Member ${memberCount}</h5>
                    <button type="button" class="remove-member" onclick="removeMember(this)">🗑️ Remove</button>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="member${memberCount}_name">Name *</label>
                        <input type="text" id="member${memberCount}_name" class="member-name" required placeholder="Enter full name">
                    </div>
                    
                    <div class="form-group">
                        <label for="member${memberCount}_gender">Gender *</label>
                        <select id="member${memberCount}_gender" class="member-gender" required>
                            <option value="">Select gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="member${memberCount}_relation">Relation to House Holder *</label>
                        <input type="text" id="member${memberCount}_relation" class="member-relation" required placeholder="e.g., Son, Daughter, Wife">
                    </div>
                    
                    <div class="form-group">
                        <label for="member${memberCount}_dob">Date of Birth *</label>
                        <input type="date" id="member${memberCount}_dob" class="member-dob" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="member${memberCount}_age">Age *</label>
                        <input type="number" id="member${memberCount}_age" class="member-age" required placeholder="Age in years" min="0" max="120">
                    </div>
                    
                    <div class="form-group">
                        <label for="member${memberCount}_fatherName">Father's Name *</label>
                        <input type="text" id="member${memberCount}_fatherName" class="member-fatherName" required placeholder="Enter father's name">
                    </div>
                    
                    <div class="form-group">
                        <label for="member${memberCount}_education">Education *</label>
                        <input type="text" id="member${memberCount}_education" class="member-education" required placeholder="Enter education qualification">
                    </div>
                    
                    <div class="form-group">
                        <label for="member${memberCount}_job">Job *</label>
                        <input type="text" id="member${memberCount}_job" class="member-job" required placeholder="Enter occupation">
                    </div>
                    
                    <div class="form-group">
                        <label for="member${memberCount}_health">Health Status *</label>
                        <select id="member${memberCount}_health" class="member-health" required>
                            <option value="">Select health status</option>
                            <option value="Good">Good</option>
                            <option value="Average">Average</option>
                            <option value="Poor">Poor</option>
                            <option value="Chronic illness">Chronic illness</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="member${memberCount}_marriage">Marriage Status *</label>
                        <select id="member${memberCount}_marriage" class="member-marriage" required>
                            <option value="">Select status</option>
                            <option value="Married">Married</option>
                            <option value="Unmarried">Unmarried</option>
                            <option value="Widowed">Widowed</option>
                            <option value="Divorced">Divorced</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="member${memberCount}_bloodGroup">Blood Group *</label>
                        <select id="member${memberCount}_bloodGroup" class="member-bloodGroup" required>
                            <option value="">Select blood group</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="member${memberCount}_mobile">Mobile Number</label>
                        <input type="tel" id="member${memberCount}_mobile" class="member-mobile" placeholder="Enter mobile number" pattern="[0-9]{10}" maxlength="10">
                    </div>
                </div>
            `;
            
            container.appendChild(memberDiv);
            
            // Add animation
            memberDiv.style.animation = 'slideIn 0.3s ease';
            
            // Auto-calculate age from DOB
            const dobInput = document.getElementById(`member${memberCount}_dob`);
            const ageInput = document.getElementById(`member${memberCount}_age`);
            
            dobInput.addEventListener('change', function() {
                if (this.value) {
                    const birthDate = new Date(this.value);
                    const today = new Date();
                    let age = today.getFullYear() - birthDate.getFullYear();
                    const m = today.getMonth() - birthDate.getMonth();
                    if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                        age--;
                    }
                    ageInput.value = age;
                }
            });
        }
        
        function removeMember(button) {
            const memberDiv = button.closest('.member-section');
            memberDiv.style.animation = 'slideOut 0.3s ease';
            setTimeout(() => {
                memberDiv.remove();
                memberCount--;
            }, 200);
        }
        
        function showAlert(message, type) {
            const alert = document.getElementById('formAlert');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alert.style.display = 'block';
            
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }
        
        document.getElementById('newDetailsForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Validate mobile
            const mobile = document.getElementById('mobile').value;
            if (!/^\d{10}$/.test(mobile)) {
                showAlert('❌ Please enter a valid 10-digit mobile number', 'error');
                return;
            }
            
            // Collect main form data
            const formData = {
                timestamp: new Date().toISOString(),
                name: document.getElementById('displayName').textContent,
                house_no: document.getElementById('displayHouseNo').textContent,
                block: document.getElementById('block').value,
                grade: document.getElementById('grade').value,
                mobile: mobile,
                house_holder: document.getElementById('houseHolder').value,
                house_name: document.getElementById('houseName').value,
                father_name: document.getElementById('fatherName').value,
                place: document.getElementById('place').value,
                house_type: document.getElementById('houseType').value,
                gender: document.getElementById('gender').value,
                postal_address: document.getElementById('postalAddress').value,
                ration_card: document.getElementById('rationCard').value,
                division: document.getElementById('division').value,
                ward: document.getElementById('ward').value,
                building_no: document.getElementById('buildingNo').value,
                old_house_no: document.getElementById('oldHouseNo').value,
                madrasa: document.getElementById('madrasa').value,
                any_grant: document.getElementById('anyGrant').value,
                donation: document.getElementById('donation').value
            };
            
            // Collect members data
            const members = [];
            for (let i = 1; i <= memberCount; i++) {
                const memberDiv = document.getElementById(`member_${i}`);
                if (memberDiv) {
                    const memberData = {
                        name: document.getElementById(`member${i}_name`)?.value || '',
                        gender: document.getElementById(`member${i}_gender`)?.value || '',
                        relation: document.getElementById(`member${i}_relation`)?.value || '',
                        dob: document.getElementById(`member${i}_dob`)?.value || '',
                        age: document.getElementById(`member${i}_age`)?.value || '',
                        father_name: document.getElementById(`member${i}_fatherName`)?.value || '',
                        education: document.getElementById(`member${i}_education`)?.value || '',
                        job: document.getElementById(`member${i}_job`)?.value || '',
                        health: document.getElementById(`member${i}_health`)?.value || '',
                        marriage: document.getElementById(`member${i}_marriage`)?.value || '',
                        blood_group: document.getElementById(`member${i}_bloodGroup`)?.value || '',
                        mobile: document.getElementById(`member${i}_mobile`)?.value || ''
                    };
                    
                    // Check if at least name is provided
                    if (memberData.name.trim() !== '') {
                        members.push(memberData);
                    }
                }
            }
            
            const submitBtn = this.querySelector('button[type="submit"]');
            const loader = document.getElementById('formLoader');
            submitBtn.disabled = true;
            loader.style.display = 'block';
            
            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'submitDetails',
                        formData: formData,
                        members: members
                    })
                });
                
                showAlert('✅ Form submitted successfully! Data saved to Google Sheet.', 'success');
                
                setTimeout(() => {
                    closeModal('newDetailsModal');
                    
                    // Reset form
                    document.getElementById('newDetailsForm').reset();
                    document.getElementById('membersContainer').innerHTML = '';
                    memberCount = 0;
                    
                    // Reset display fields
                    document.getElementById('displayName').textContent = sessionStorage.getItem('userName');
                    document.getElementById('displayHouseNo').textContent = sessionStorage.getItem('userHouse');
                }, 2000);
                
            } catch (error) {
                console.error('Error:', error);
                showAlert('❌ Error submitting form. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                loader.style.display = 'none';
            }
        });
        
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        };
        
        // Mobile number validation
        document.getElementById('mobile').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);
        });
        
        // Add CSS animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideOut {
                from {
                    opacity: 1;
                    transform: translateX(0);
                }
                to {
                    opacity: 0;
                    transform: translateX(100%);
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
