<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #f0f2f5;
            min-height: 100vh;
        }
        
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        @media (max-width: 768px) {
            .navbar {
                padding: 1rem;
                flex-direction: column;
                gap: 0.5rem;
                text-align: center;
            }
        }
        
        @media (max-width: 480px) {
            .navbar {
                padding: 0.75rem;
            }
        }
        
        .user-info {
            font-size: clamp(1rem, 4vw, 1.2rem);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .user-info::before {
            content: '👤';
            font-size: 1.3rem;
        }
        
        .logout-btn {
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            backdrop-filter: blur(5px);
        }
        
        @media (max-width: 768px) {
            .logout-btn {
                width: 100%;
                max-width: 200px;
            }
        }
        
        .logout-btn:hover {
            background: rgba(255,255,255,0.25);
            border-color: rgba(255,255,255,0.5);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 0 1rem;
                margin: 1rem auto;
            }
        }
        
        .welcome-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            animation: slideDown 0.5s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .welcome-card h2 {
            color: #333;
            font-size: clamp(1.3rem, 5vw, 1.8rem);
            margin-bottom: 0.5rem;
        }
        
        .welcome-card p {
            color: #666;
            font-size: 1rem;
        }
        
        .buttons-section {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        
        @media (max-width: 640px) {
            .buttons-section {
                gap: 1rem;
            }
        }
        
        .action-btn {
            padding: 1.2rem 2.5rem;
            border: none;
            border-radius: 50px;
            font-size: clamp(1rem, 4vw, 1.2rem);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 200px;
            max-width: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }
        
        @media (max-width: 480px) {
            .action-btn {
                min-width: 100%;
                padding: 1rem;
            }
        }
        
        .action-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .action-btn:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .old-details {
            background: linear-gradient(135deg, #667eea 0%, #5a67d8 100%);
            color: white;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .new-details {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            box-shadow: 0 10px 20px rgba(72, 187, 120, 0.3);
        }
        
        .action-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        
        .action-btn:active {
            transform: translateY(0);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease;
            overflow-y: auto;
            padding: 1rem;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-content {
            position: relative;
            background: white;
            margin: 2rem auto;
            padding: 2rem;
            width: 90%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            animation: slideUp 0.4s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 768px) {
            .modal-content {
                margin: 1rem auto;
                padding: 1.5rem;
                width: 95%;
            }
        }
        
        @media (max-width: 480px) {
            .modal-content {
                padding: 1.25rem;
            }
        }
        
        .close-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            font-size: 1.8rem;
            cursor: pointer;
            color: #999;
            transition: all 0.3s;
            background: none;
            border: none;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #f0f0f0;
        }
        
        @media (max-width: 480px) {
            .close-btn {
                top: 1rem;
                right: 1rem;
                width: 35px;
                height: 35px;
                font-size: 1.5rem;
            }
        }
        
        .close-btn:hover {
            color: #f56565;
            transform: rotate(90deg);
            background: #fee;
        }
        
        h2 {
            color: #333;
            margin-bottom: 2rem;
            font-size: clamp(1.3rem, 5vw, 1.8rem);
            padding-right: 2rem;
        }
        
        .image-container {
            text-align: center;
            margin: 1.5rem 0;
            padding: 1rem;
            background: #f9f9f9;
            border-radius: 20px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .image-container img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: transform 0.3s;
        }
        
        .image-container img:hover {
            transform: scale(1.02);
        }
        
        #noImageMsg {
            color: #888;
            font-size: 1.1rem;
            padding: 2rem;
            background: white;
            border-radius: 15px;
            border: 2px dashed #ddd;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 600;
            font-size: 0.95rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-group input[readonly] {
            background-color: #f7fafc;
            cursor: not-allowed;
            border-color: #ddd;
            color: #666;
        }
        
        .members-section {
            margin: 2rem 0;
            padding: 1.5rem;
            background: #f8fafc;
            border-radius: 20px;
            border: 2px solid #edf2f7;
        }
        
        .members-section h3 {
            color: #4a5568;
            margin-bottom: 1.5rem;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .member-input {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
            animation: slideIn 0.3s ease;
        }
        
        @media (max-width: 480px) {
            .member-input {
                flex-direction: column;
            }
        }
        
        .member-input input {
            flex: 1;
            padding: 0.875rem;
        }
        
        .remove-member {
            background: #f56565;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0.875rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            white-space: nowrap;
        }
        
        @media (max-width: 480px) {
            .remove-member {
                width: 100%;
            }
        }
        
        .remove-member:hover {
            background: #c53030;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(197, 48, 48, 0.3);
        }
        
        .add-member {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0.875rem 1.5rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.3s;
            font-weight: 600;
            width: 100%;
            font-size: 1rem;
        }
        
        .add-member:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .submit-btn {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 2rem;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(72, 187, 120, 0.4);
        }
        
        .submit-btn:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .alert {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: none;
            font-weight: 500;
            text-align: center;
            animation: slideIn 0.3s ease;
        }
        
        .alert-success {
            background: #f0fff4;
            color: #22543d;
            border: 2px solid #9ae6b4;
        }
        
        .alert-error {
            background: #fff5f5;
            color: #742a2a;
            border: 2px solid #fc8181;
        }
        
        .loader {
            display: none;
            text-align: center;
            margin: 2rem 0;
        }
        
        .loader:after {
            content: '';
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }
        
        .info-card {
            background: #f7fafc;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        
        .info-card strong {
            color: #4a5568;
            display: block;
            margin-bottom: 0.25rem;
            font-size: 0.9rem;
        }
        
        .info-card p {
            color: #2d3748;
            font-size: 1.1rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="user-info" id="userInfo"></div>
        <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </div>
    
    <div class="container">
        <div class="welcome-card">
            <h2>Welcome to Dashboard</h2>
            <p>Choose an option below to view or update your details</p>
        </div>
        
        <div class="buttons-section">
            <button class="action-btn old-details" onclick="showOldDetails()">
                <span>📸</span> Old Details
            </button>
            <button class="action-btn new-details" onclick="showNewDetails()">
                <span>📝</span> New Details
            </button>
        </div>
    </div>
    
    <!-- Old Details Modal -->
    <div id="oldDetailsModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('oldDetailsModal')">&times;</button>
            <h2>📸 Old Details - Image</h2>
            <div class="image-container" id="imageContainer">
                <img id="userImage" src="" alt="User Image" style="display: none;">
                <div id="noImageMsg" style="display: none;">
                    <span style="font-size: 3rem;">🖼️</span>
                    <p>No image available</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- New Details Modal -->
    <div id="newDetailsModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('newDetailsModal')">&times;</button>
            <h2>📝 New Details Form</h2>
            
            <div id="formAlert" class="alert"></div>
            <div id="formLoader" class="loader"></div>
            
            <form id="newDetailsForm">
                <div class="info-grid">
                    <div class="info-card">
                        <strong>Name</strong>
                        <p id="name"></p>
                    </div>
                    <div class="info-card">
                        <strong>House No</strong>
                        <p id="house_no"></p>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="block">🏢 Block Number</label>
                    <input type="text" id="block" required placeholder="Enter block number (e.g., A-101)">
                </div>
                
                <div class="form-group">
                    <label for="father_name">👨 Father's Name</label>
                    <input type="text" id="father_name" required placeholder="Enter father's full name">
                </div>
                
                <div class="form-group">
                    <label for="place">📍 Place</label>
                    <input type="text" id="place" required placeholder="Enter your place/city">
                </div>
                
                <div class="form-group">
                    <label for="ph">📞 Phone Number</label>
                    <input type="tel" id="ph" required placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}" maxlength="10" title="Please enter a valid 10-digit phone number">
                </div>
                
                <div class="members-section">
                    <h3>👥 Additional Family Members</h3>
                    <div id="membersContainer">
                        <!-- Members will be added here dynamically -->
                    </div>
                    <button type="button" class="add-member" onclick="addMember()">➕ Add Family Member</button>
                </div>
                
                <button type="submit" class="submit-btn">✅ Submit to Google Sheet</button>
            </form>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxj4gXDFItpHK-r-r6W4CttIl_8xezV8xcN0_ExGkJ6jSzH80RhXpE0TtvAAK4PhAt5Wg/exec';
        
        window.onload = function() {
            const userName = sessionStorage.getItem('userName');
            const userHouse = sessionStorage.getItem('userHouse');
            
            if (!userName || !userHouse) {
                window.location.href = 'index.html';
                return;
            }
            
            document.getElementById('userInfo').innerHTML = `${userName} | 🏠 House ${userHouse}`;
            
            document.getElementById('name').textContent = userName;
            document.getElementById('house_no').textContent = userHouse;
            
            addMember();
        };
        
        function logout() {
            const btn = document.querySelector('.logout-btn');
            btn.innerHTML = '⏳ Logging out...';
            btn.disabled = true;
            
            setTimeout(() => {
                sessionStorage.clear();
                window.location.href = 'index.html';
            }, 500);
        }
        
        function showOldDetails() {
            const imageUrl = sessionStorage.getItem('userImage');
            const imageElement = document.getElementById('userImage');
            const noImageMsg = document.getElementById('noImageMsg');
            
            if (imageUrl && imageUrl.trim() !== '') {
                imageElement.src = imageUrl;
                imageElement.style.display = 'block';
                noImageMsg.style.display = 'none';
            } else {
                imageElement.style.display = 'none';
                noImageMsg.style.display = 'block';
            }
            
            document.getElementById('oldDetailsModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }
        
        function showNewDetails() {
            document.getElementById('newDetailsModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
            document.body.style.overflow = 'auto';
            document.getElementById('formAlert').style.display = 'none';
        }
        
        function addMember() {
            const container = document.getElementById('membersContainer');
            const memberCount = container.children.length + 1;
            
            const memberDiv = document.createElement('div');
            memberDiv.className = 'member-input';
            memberDiv.innerHTML = `
                <input type="text" placeholder="Enter member ${memberCount} name" class="member-name">
                <button type="button" class="remove-member" onclick="removeMember(this)">🗑️ Remove</button>
            `;
            
            container.appendChild(memberDiv);
            
            // Add animation
            memberDiv.style.animation = 'slideIn 0.3s ease';
        }
        
        function removeMember(button) {
            const memberDiv = button.parentElement;
            memberDiv.style.animation = 'slideOut 0.3s ease';
            setTimeout(() => {
                memberDiv.remove();
            }, 200);
        }
        
        function showAlert(message, type) {
            const alert = document.getElementById('formAlert');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alert.style.display = 'block';
            
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }
        
        document.getElementById('newDetailsForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('ph').value;
            if (!/^\d{10}$/.test(phone)) {
                showAlert('❌ Please enter a valid 10-digit phone number', 'error');
                return;
            }
            
            const formData = {
                name: document.getElementById('name').textContent,
                house_no: document.getElementById('house_no').textContent,
                block: document.getElementById('block').value,
                father_name: document.getElementById('father_name').value,
                place: document.getElementById('place').value,
                ph: phone
            };
            
            const members = [];
            document.querySelectorAll('.member-name').forEach(input => {
                if (input.value.trim() !== '') {
                    members.push(input.value.trim());
                }
            });
            
            const submitBtn = this.querySelector('button[type="submit"]');
            const loader = document.getElementById('formLoader');
            submitBtn.disabled = true;
            loader.style.display = 'block';
            
            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'submitDetails',
                        formData: formData,
                        members: members
                    })
                });
                
                showAlert('✅ Form submitted successfully! Data saved to Google Sheet.', 'success');
                
                setTimeout(() => {
                    closeModal('newDetailsModal');
                    
                    document.getElementById('block').value = '';
                    document.getElementById('father_name').value = '';
                    document.getElementById('place').value = '';
                    document.getElementById('ph').value = '';
                    
                    document.getElementById('membersContainer').innerHTML = '';
                    addMember();
                    
                    document.getElementById('name').textContent = sessionStorage.getItem('userName');
                    document.getElementById('house_no').textContent = sessionStorage.getItem('userHouse');
                }, 2000);
                
            } catch (error) {
                console.error('Error:', error);
                showAlert('❌ Error submitting form. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                loader.style.display = 'none';
            }
        });
        
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        };
        
        document.getElementById('ph').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);
        });
        
        // Add CSS animation for remove
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideOut {
                from {
                    opacity: 1;
                    transform: translateX(0);
                }
                to {
                    opacity: 0;
                    transform: translateX(100%);
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
